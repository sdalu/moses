name: Build validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install packaged dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install libmosquitto-dev libdbus-1-dev dbus

    - name: Configure
      run: cmake -B build -DWITH_LOG=1 -DWITH_LINEPROTOCOL=1 -DWITH_WERROR=1 -DWITH_TESTS=ON -DWITH_DBUS=ON

    - name: Build
      run: cmake --build build --parallel "$(nproc)"

    - name: Test
      run: ctest --test-dir build --output-on-failure

    # Separate build so a static-analysis finding is distinguishable from a
    # plain build break. -fanalyzer is scoped to first-party sources.
    - name: Static analysis (gcc -fanalyzer)
      run: |
        cmake -B build-analyze -DWITH_LOG=1 -DWITH_LINEPROTOCOL=1 -DWITH_WERROR=1 -DWITH_ANALYZER=1 -DWITH_DBUS=ON
        cmake --build build-analyze --parallel "$(nproc)"

    - name: Upload executables
      uses: actions/upload-artifact@v4
      with:
        name: moses-binaries
        path: bin/
        if-no-files-found: error
