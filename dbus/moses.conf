<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  moses on the system bus (README, "The system bus, beside MQTT").

  The system bus lets nobody own a name and nobody call a method until
  a file like this one says so. Install it as
  /etc/dbus-1/system.d/moses.conf; dbus-daemon picks it up on its own,
  no reload needed. Without it the daemons log "cannot own" once and
  carry on without the bus, and moses_display, left to choose, reads the
  broker instead: it finds out by asking for moses.display, since the
  bus has no call that reports its policy.

  The three daemons and moses_display run as root on the machine the
  hardware is on. If they run as another user, change the first policy
  to that user.
-->
<busconfig>

  <!-- The daemons: moses.watermeter, moses.breaker, moses.sensors.
       And moses_display: moses.display serves nothing, and owning it is
       how the display learns that this file is loaded.
       Root is also the only one who may command the valve: SetState on
       moses.Actuator is state/set without the broker, and nothing else
       on this machine has any business shutting the water. -->
  <policy user="root">
    <allow own="moses.watermeter"/>
    <allow own="moses.breaker"/>
    <allow own="moses.sensors"/>
    <allow own="moses.display"/>
    <allow send_destination="moses.breaker"
           send_interface="moses.Actuator"
           send_member="SetState"/>
  </policy>

  <!-- Anyone may ask a daemon what it last said, and what it serves.
       Nothing else: moses.Readings has no methods of its own, its one
       property is read-only, and Set is refused by the daemon anyway.
       moses.Actuator is deliberately absent here. Receiving the Line
       signals needs no rule; the bus allows every signal by default. -->
  <policy context="default">
    <allow send_destination="moses.watermeter"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="moses.watermeter"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="moses.watermeter"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="moses.watermeter"
           send_interface="org.freedesktop.DBus.Peer"/>

    <allow send_destination="moses.breaker"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="moses.breaker"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="moses.breaker"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="moses.breaker"
           send_interface="org.freedesktop.DBus.Peer"/>

    <allow send_destination="moses.sensors"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="moses.sensors"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="moses.sensors"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="moses.sensors"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

</busconfig>
